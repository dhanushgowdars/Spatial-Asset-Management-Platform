name: Aereo GeoInsight CI

on:
  push:
    branches:
      - main
      - feature/aereo-geospatial-measurements
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoinsight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: FastAPI and GIS regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            aereo-requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r aereo-requirements.txt

      - name: Run isolated Aereo API and GIS tests
        run: python -m pytest aereo_tests -q

  frontend:
    name: React lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Validate GIS demo contracts
        run: node --test src/pages/SpatialIntelligence/demoContracts.test.mjs

      - name: Run geospatial UI and V2 logic tests
        run: |
          node --test \
            src/pages/SpatialIntelligence/derivedProvenance.test.mjs \
            src/pages/SpatialIntelligence/presentation.test.mjs \
            src/pages/SpatialIntelligence/negativeZeroDisplay.test.mjs \
            src/pages/SpatialIntelligence/surveyChangeBrief.test.mjs \
            src/pages/Geospatial/measurementPagination.test.mjs \
            src/pages/Geospatial/surveyEvidence.test.mjs

      - name: Lint frontend
        run: npm run lint

      - name: Build production frontend
        run: npm run build

      - name: Review production dependency advisories (informational)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
